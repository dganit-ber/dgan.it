<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="ff-library system architecture: browser and extension talk to Next.js on Vercel, which reads and writes Supabase Postgres, scrapes AO3 / FanFiction.net server-side, and sends email through Resend.">
  <style>
    :root {
      --card: #1c1a22;
      --card-2: #201d28;
      --stroke: #322e3d;
      --text: #eae7f0;
      --muted: #a9a4bb;
      --accent: #8b5cf6;
      --accent-dim: #b9a4f2;
      --accent-fill: rgba(139, 92, 246, 0.10);
      --accent-stroke: rgba(139, 92, 246, 0.45);
      --arrow: #837e97;
      --group: #322e3d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --card: #ffffff;
        --card-2: #f7f5fb;
        --stroke: #e6e1f0;
        --text: #18171f;
        --muted: #58546c;
        --accent: #7c3aed;
        --accent-dim: #6d28d9;
        --accent-fill: rgba(124, 58, 237, 0.07);
        --accent-stroke: rgba(124, 58, 237, 0.32);
        --arrow: #8a8699;
        --group: #d9d3e8;
      }
    }
    .card   { fill: var(--card); stroke: var(--stroke); stroke-width: 1.4; }
    .accent { fill: var(--accent-fill); stroke: var(--accent-stroke); stroke-width: 1.4; }
    .group  { fill: none; stroke: var(--group); stroke-width: 1.4; stroke-dasharray: 3 5; }
    .t  { fill: var(--text); font-size: 19px; font-weight: 600; }
    .s  { fill: var(--muted); font-size: 12.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sa { fill: var(--accent-dim); font-size: 12.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .g  { fill: var(--accent); font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .e  { fill: var(--muted); font-size: 11.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .flow   { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .flow-d { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 6 5; }
    .ahf { fill: var(--arrow); }
    .ahd { fill: var(--accent); }
    .cap { fill: var(--text); font-size: 16px; font-weight: 700; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ahf"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ahd"/>
    </marker>
  </defs>

  <!-- ============ CONNECTORS ============ -->
  <!-- web app -> Server Components -->
  <path class="flow" marker-end="url(#ah)" d="M422,302 C 500,302 520,310 586,310"/>
  <text class="e" x="452" y="292">render</text>
  <!-- web app -> Server Actions -->
  <path class="flow" marker-end="url(#ah)" d="M422,342 C 505,342 530,393 586,393"/>
  <text class="e" x="452" y="372">mutations</text>
  <!-- extension -> Extension API routes -->
  <path class="flow" marker-end="url(#ah)" d="M422,452 C 505,452 530,476 586,476"/>
  <text class="e" x="430" y="500">POST &#183; session cookie</text>
  <!-- AO3 -> Metadata scraper -->
  <path class="flow" marker-end="url(#ah)" d="M800,94 L800,190"/>
  <text class="e" x="814" y="140">server-side scrape</text>
  <!-- AO3 -> extension (client-side DOM read) -->
  <path class="flow-d" marker-end="url(#ahd)" d="M582,54 C 340,26 40,96 40,250 C 40,360 40,420 56,438"/>
  <text class="e" x="120" y="120">reads page DOM for locked works</text>
  <!-- Next.js -> Supabase -->
  <path class="flow" marker-end="url(#ah)" d="M798,522 L798,556"/>
  <text class="e" x="812" y="545">all queries &#183; RLS enforced</text>
  <!-- Next.js -> Resend -->
  <path class="flow" marker-end="url(#ah)" d="M1038,474 C 1130,474 1180,520 1206,556"/>
  <text class="e" x="1060" y="512">auth email</text>

  <!-- ============ AO3 / FFN ============ -->
  <rect class="accent" x="580" y="10" width="440" height="84" rx="11"/>
  <text class="g" x="800" y="34" text-anchor="middle">EXTERNAL SOURCE</text>
  <text class="t" x="800" y="60" text-anchor="middle">AO3 / FanFiction.net</text>
  <text class="s" x="800" y="80" text-anchor="middle">the fics live here &#8212; metadata is read from it</text>

  <!-- ============ CLIENT ============ -->
  <rect class="group" x="36" y="214" width="412" height="326" rx="14"/>
  <text class="g" x="58" y="242">CLIENT</text>

  <rect class="card" x="58" y="258" width="364" height="120" rx="10"/>
  <text class="t" x="78" y="292">ff-library web app</text>
  <text class="s" x="78" y="316">Next.js App Router &#183; React client</text>
  <text class="s" x="78" y="338">renders collections and work cards</text>

  <rect class="card" x="58" y="396" width="364" height="128" rx="10"/>
  <text class="t" x="78" y="428">Browser extension</text>
  <text class="s" x="78" y="452">Chrome Web Store &#183; Firefox Add-ons</text>
  <text class="s" x="78" y="474">injects a Save button into archive pages</text>
  <text class="s" x="78" y="496">worker requests carry the session cookie</text>

  <!-- ============ NEXT.JS ============ -->
  <rect class="group" x="560" y="150" width="476" height="372" rx="14"/>
  <text class="g" x="582" y="178">NEXT.JS ON VERCEL</text>

  <rect class="card" x="586" y="190" width="424" height="72" rx="10"/>
  <text class="t" x="608" y="222">Metadata scraper</text>
  <text class="s" x="608" y="244">server-side fetch + parse of archive pages</text>

  <rect class="card" x="586" y="275" width="424" height="72" rx="10"/>
  <text class="t" x="608" y="307">Server Components</text>
  <text class="s" x="608" y="329">read path &#8212; rendered on the server</text>

  <rect class="card" x="586" y="358" width="424" height="72" rx="10"/>
  <text class="t" x="608" y="390">Server Actions</text>
  <text class="s" x="608" y="412">writes &#8212; typed results instead of throws</text>

  <rect class="card" x="586" y="441" width="424" height="72" rx="10"/>
  <text class="t" x="608" y="473">Extension API routes</text>
  <text class="s" x="608" y="495">thin &#8212; authenticate, then check ownership</text>

  <!-- ============ SUPABASE ============ -->
  <rect class="accent" x="560" y="556" width="476" height="130" rx="11"/>
  <text class="g" x="582" y="582">DATABASE</text>
  <text class="t" x="582" y="608">Supabase &#8212; Postgres</text>
  <text class="s" x="582" y="632">Row Level Security is the real boundary</text>
  <text class="sa" x="582" y="660">works &#183; collections &#183; collection_works &#183; work_notes</text>

  <!-- ============ RESEND ============ -->
  <rect class="accent" x="1064" y="556" width="380" height="130" rx="11"/>
  <text class="g" x="1086" y="582">EXTERNAL</text>
  <text class="t" x="1086" y="608">Resend</text>
  <text class="s" x="1086" y="632">transactional email</text>
  <text class="s" x="1086" y="654">verification &#183; password reset</text>

  <!-- ============ CAPTION + LEGEND ============ -->
  <text class="cap" x="40" y="590">ff-library</text>
  <text class="g" x="40" y="610">SYSTEM ARCHITECTURE</text>
  <path class="flow" marker-end="url(#ah)" d="M40,638 L74,638"/>
  <text class="e" x="84" y="642">server data flow</text>
  <path class="flow-d" marker-end="url(#ahd)" d="M40,662 L74,662"/>
  <text class="e" x="84" y="666">browser DOM read</text>
</svg>
