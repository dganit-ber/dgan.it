<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="ff-library system architecture. The browser web app and a browser extension talk to Next.js on Vercel (server components, server actions, extension API routes, metadata scraper). Next.js reads and writes a Supabase Postgres database with Row Level Security, scrapes Archive of Our Own (AO3) server-side for metadata, and sends transactional email through Resend. The extension also reads the AO3 page DOM directly for locked works.">
  <style>
    :root {
      --bg: #131218;
      --card: #1c1a22;
      --card-accent: #241d33;
      --stroke: #35303f;
      --stroke-accent: #4b3d70;
      --text: #ece9f2;
      --muted: #a9a4bb;
      --accent: #a78bfa;
      --accent-dim: #c4b5fd;
      --arrow: #8b86a0;
      --group: #3a3547;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf9fc;
        --card: #ffffff;
        --card-accent: #f3eefc;
        --stroke: #e6e1f0;
        --stroke-accent: #d7c9f5;
        --text: #18171f;
        --muted: #58546c;
        --accent: #7c3aed;
        --accent-dim: #6d28d9;
        --arrow: #8a8699;
        --group: #d9d3e8;
      }
    }
    .card   { fill: var(--card);        stroke: var(--stroke);        stroke-width: 1.4; }
    .accent { fill: var(--card-accent); stroke: var(--stroke-accent); stroke-width: 1.4; }
    .group  { fill: none; stroke: var(--group); stroke-width: 1.4; stroke-dasharray: 2 6; stroke-linecap: round; }
    .t  { fill: var(--text);  font-size: 19px; font-weight: 600; }
    .s  { fill: var(--muted); font-size: 12.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sa { fill: var(--accent-dim); font-size: 12.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .g  { fill: var(--accent); font-size: 11.5px; font-weight: 600; letter-spacing: 2.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .e  { fill: var(--muted); font-size: 11.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .flow   { fill: none; stroke: var(--arrow);  stroke-width: 1.75; }
    .flow-d { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-dasharray: 6 5; }
    .ahf { fill: var(--arrow); }
    .ahd { fill: var(--accent); }
    .cap { fill: var(--text); font-size: 16px; font-weight: 700; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 11 11" refX="9" refY="5.5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" class="ahf"/>
    </marker>
    <marker id="ahd" viewBox="0 0 11 11" refX="9" refY="5.5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" class="ahd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="700" fill="var(--bg)"/>

  <!-- ============ CONNECTORS ============ -->
  <!-- web app -> Server Components -->
  <path class="flow" marker-end="url(#ah)" d="M422,302 C 520,302 560,310 624,310"/>
  <text class="e" x="470" y="298">render</text>
  <!-- web app -> Server Actions -->
  <path class="flow" marker-end="url(#ah)" d="M422,342 C 530,342 560,393 624,393"/>
  <text class="e" x="470" y="384">actions</text>
  <!-- extension -> Extension API routes -->
  <path class="flow" marker-end="url(#ah)" d="M422,452 C 530,452 560,476 624,476"/>
  <text class="e" x="486" y="486">POST</text>
  <!-- AO3 -> Metadata scraper -->
  <path class="flow" marker-end="url(#ah)" d="M840,96 L840,188"/>
  <text class="e" x="856" y="128">server-side scrape</text>
  <!-- AO3 -> extension (client-side DOM read) -->
  <path class="flow-d" marker-end="url(#ahd)" d="M620,54 C 360,26 40,96 40,250 C 40,360 40,420 54,438"/>
  <text class="e" x="150" y="40">reads page DOM for locked works</text>
  <!-- Next.js -> Supabase -->
  <path class="flow" marker-end="url(#ah)" d="M838,522 L838,550"/>
  <text class="e" x="852" y="541">all queries &#183; RLS enforced</text>
  <!-- Next.js -> Resend -->
  <path class="flow" marker-end="url(#ah)" d="M1078,476 C 1160,476 1214,516 1244,550"/>
  <text class="e" x="1092" y="505">auth email</text>

  <!-- ============ AO3 ============ -->
  <rect class="accent" x="620" y="12" width="440" height="84" rx="11"/>
  <text class="g" x="840" y="36" text-anchor="middle">EXTERNAL SOURCE</text>
  <text class="t" x="840" y="62" text-anchor="middle">Archive of Our Own</text>
  <text class="s" x="840" y="82" text-anchor="middle">the fics live here &#8212; metadata is read from it</text>

  <!-- ============ CLIENT ============ -->
  <rect class="group" x="36" y="214" width="412" height="326" rx="14"/>
  <text class="g" x="58" y="242">CLIENT</text>

  <rect class="card" x="58" y="258" width="364" height="120" rx="10"/>
  <text class="t" x="78" y="292">ff-library web app</text>
  <text class="s" x="78" y="316">Next.js App Router &#183; React client</text>
  <text class="s" x="78" y="338">renders collections and work cards</text>

  <rect class="card" x="58" y="396" width="364" height="128" rx="10"/>
  <text class="t" x="78" y="428">Browser extension</text>
  <text class="s" x="78" y="452">Chrome Web Store &#183; Firefox Add-ons</text>
  <text class="s" x="78" y="474">injects a Save button into AO3 pages</text>
  <text class="s" x="78" y="496">worker requests carry the session cookie</text>

  <!-- ============ NEXT.JS ============ -->
  <rect class="group" x="600" y="150" width="476" height="372" rx="14"/>
  <text class="g" x="622" y="178">NEXT.JS ON VERCEL</text>

  <rect class="card" x="626" y="188" width="424" height="72" rx="10"/>
  <text class="t" x="648" y="220">Metadata scraper</text>
  <text class="s" x="648" y="242">server-side fetch + parse of AO3 pages</text>

  <rect class="card" x="626" y="274" width="424" height="72" rx="10"/>
  <text class="t" x="648" y="306">Server Components</text>
  <text class="s" x="648" y="328">read path &#8212; rendered on the server</text>

  <rect class="card" x="626" y="360" width="424" height="72" rx="10"/>
  <text class="t" x="648" y="392">Server Actions</text>
  <text class="s" x="648" y="414">writes &#8212; typed results instead of throws</text>

  <rect class="card" x="626" y="446" width="424" height="72" rx="10"/>
  <text class="t" x="648" y="478">Extension API routes</text>
  <text class="s" x="648" y="500">thin &#8212; authenticate, then check ownership</text>

  <!-- ============ SUPABASE ============ -->
  <rect class="accent" x="600" y="550" width="476" height="130" rx="11"/>
  <text class="g" x="622" y="578">DATABASE</text>
  <text class="t" x="622" y="604">Supabase &#8212; Postgres</text>
  <text class="s" x="622" y="628">Row Level Security is the real boundary</text>
  <text class="sa" x="622" y="656">works &#183; collections &#183; collection_works &#183; work_notes</text>

  <!-- ============ RESEND ============ -->
  <rect class="accent" x="1104" y="550" width="360" height="130" rx="11"/>
  <text class="g" x="1126" y="578">EXTERNAL</text>
  <text class="t" x="1126" y="604">Resend</text>
  <text class="s" x="1126" y="628">transactional email</text>
  <text class="s" x="1126" y="650">verification &#183; password reset</text>

  <!-- ============ CAPTION + LEGEND ============ -->
  <text class="cap" x="40" y="582">ff-library</text>
  <text class="g" x="40" y="602">SYSTEM ARCHITECTURE</text>
  <path class="flow" marker-end="url(#ah)" d="M40,632 L78,632"/>
  <text class="e" x="90" y="636">server data flow</text>
  <path class="flow-d" marker-end="url(#ahd)" d="M40,656 L78,656"/>
  <text class="e" x="90" y="660">browser DOM read</text>
</svg>
